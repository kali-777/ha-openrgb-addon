name: "OpenRGB SDK Server"
version: "1.2.3"
slug: "openrgb_server"
description: "Headless OpenRGB SDK Server (v1.0+) & Generic DDC/CI Monitor Control for Home Assistant OS — supports direct USB HID, WiZ, Yeelight, Kasa, and automated DDC/CI monitor input switching, brightness, speaker volume & mute control."
url: "https://github.com/kali-777/ha-openrgb-addon"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
host_network: true
usb: true
udev: true
uart: true
full_access: true
apparmor: false
hassio_api: true
privileged:
  - SYS_ADMIN
  - SYS_RAWIO
kernel_modules: false
map:
  - type: addon_config
    read_only: false
    path: /config
options:
  server_port: 6742
  server_host: "0.0.0.0"
  log_level: "info"
  list_devices_on_start: true
  enable_ddc: true
  ddc_port: 6743
  ddc_mqtt_discovery: true
  ddc_poll_interval: 60
  mqtt_username: ""
  mqtt_password: ""
  wiz_ips:
    - "192.168.2.65"
  wiz_white_strategy: "Average"
  yeelight_ips: []
  kasa_ips: []
  extra_args: ""
schema:
  server_port: "port"
  server_host: "str"
  log_level: "list(trace|debug|info|warning|error)"
  list_devices_on_start: "bool"
  enable_ddc: "bool"
  ddc_port: "port"
  ddc_mqtt_discovery: "bool"
  ddc_poll_interval: "int"
  mqtt_username: "str?"
  mqtt_password: "password"
  wiz_ips:
    - "str"
  wiz_white_strategy: "list(Average|Lowest|None)"
  yeelight_ips:
    - "str"
  kasa_ips:
    - "str"
  extra_args: "str?"
